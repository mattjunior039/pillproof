[project]
name = "medlabel-data"
version = "0.1.0"
description = "Data pipeline for the label-grounded medication assistant (FDARxBench, MedicationQA, FDA labels)"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medlabel_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
